<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="지금 가면 좋은 곳과 곧 시작하는 축제·전시·공연을 한눈에.">
  <meta name="color-scheme" content="light dark">
  <title>놀거리 도우미</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>놀거리 도우미</h1>
      <p class="today" id="today"></p>
    </div>
  </header>

  <div class="controls">
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="시기">
        <button type="button" role="tab" data-tab="now" aria-selected="true">
          지금 가면 좋은 곳 <span class="count" id="count-now"></span>
        </button>
        <button type="button" role="tab" data-tab="soon" aria-selected="false">
          곧 시작 <span class="count" id="count-soon"></span>
        </button>
      </div>

      <div class="filters">
        <div class="chips" id="themes" role="group" aria-label="테마">
          <button type="button" data-theme="all" aria-pressed="true">전체</button>
          <button type="button" data-theme="festival" aria-pressed="false">축제·행사</button>
          <button type="button" data-theme="exhibition" aria-pressed="false">전시</button>
          <button type="button" data-theme="performance" aria-pressed="false">공연</button>
          <button type="button" data-theme="hot" aria-pressed="false">요즘 핫한</button>
        </div>

        <div class="selects">
          <label>
            <span class="sr-only">지역</span>
            <select id="region"></select>
          </label>
          <label id="within-label" hidden>
            <span class="sr-only">시작 시기</span>
            <select id="within">
              <option value="14">2주 안에 시작</option>
              <option value="30">한 달 안에 시작</option>
              <option value="60">두 달 안에 시작</option>
            </select>
          </label>
          <label>
            <span class="sr-only">정렬</span>
            <select id="sort">
              <option value="time" id="sort-time">끝나는 날 빠른 순</option>
              <option value="near">가까운 순</option>
            </select>
          </label>
        </div>
      </div>
    </div>
  </div>

  <main class="wrap">
    <p class="notice" id="notice" hidden></p>
    <p class="status" id="status" aria-live="polite">불러오는 중…</p>
    <div class="grid" id="list"></div>
    <button type="button" class="more" id="more" hidden></button>
  </main>

  <footer class="wrap foot">
    <p id="meta"></p>
    <p>일정과 장소는 주최 측 사정으로 바뀔 수 있습니다. 방문 전에 공식 안내를 확인하세요.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
